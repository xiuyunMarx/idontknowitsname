    opening_statement: "\U0001F44B Welcome! I'm your personal NYT Tech News assistant.\
      \ \n\nTell me what you'd like to catch up on today \u2014 type any topic in\
      \ the technology space, like AI, LLM, or cybersecurity, and and I'll find the\
      \ most relevant stories from today's New York Times Technology section for you."
