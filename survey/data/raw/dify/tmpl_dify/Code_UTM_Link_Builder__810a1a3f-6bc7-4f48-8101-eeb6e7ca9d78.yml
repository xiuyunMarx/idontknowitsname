    - data:
        code: "function main(arg1) {\n    const base_url = arg1.base_url || \"\";\n\
          \    if (!base_url) {\n        return { utm_url: \"Error: Please provide\
          \ a base_url\" };\n    }\n\n    const params = new URLSearchParams();\n\
          \    \n    if (arg1.utm_source && arg1.utm_source.trim()) params.append(\"\
          utm_source\", arg1.utm_source.trim());\n    if (arg1.utm_medium && arg1.utm_medium.trim())\
          \ params.append(\"utm_medium\", arg1.utm_medium.trim());\n    if (arg1.utm_campaign\
          \ && arg1.utm_campaign.trim()) params.append(\"utm_campaign\", arg1.utm_campaign.trim());\n\
          \    if (arg1.utm_term && arg1.utm_term.trim()) params.append(\"utm_term\"\
          , arg1.utm_term.trim());\n    if (arg1.utm_content && arg1.utm_content.trim())\
          \ params.append(\"utm_content\", arg1.utm_content.trim());\n\n    const\
          \ separator = base_url.includes(\"?\") ? \"&\" : \"?\";\n    const final_url\
          \ = `${base_url}${separator}${params.toString()}`;\n\n    return { utm_url:\
          \ final_url };\n}"
