    - data:
        code: "import json\n\ndef _rec_bucket(rec: str):\n  r = (rec or \"\").strip().lower()\n\
          \  if r in [\"strong_yes\", \"yes\", \"advance\"]:\n    return \"advance\"\
          \n  if r in [\"maybe\", \"borderline\"]:\n    return \"maybe\"\n  return\
          \ \"reject\"\n\ndef main(candidates, top_k=10):\n  if not isinstance(candidates,\
          \ list):\n    candidates = []\n\n  # Unwrap if iterator returns {\"candidate_record\"\
          : {...}}\n  cleaned = []\n  for item in candidates:\n    if not isinstance(item,\
          \ dict):\n      continue\n    c = item.get(\"candidate_record\") if \"candidate_record\"\
          \ in item else item\n    if isinstance(c, dict):\n      cleaned.append(c)\n\
          \n  def score10(c):\n    s = c.get(\"final_score_10\", None)\n    if s is\
          \ None:\n      s100 = c.get(\"final_score_100\", 0)\n      try:\n      \
          \  return float(s100) / 10.0\n      except:\n        return 0.0\n    try:\n\
          \      return float(s)\n    except:\n      return 0.0\n\n  cleaned.sort(\n\
          \    key=lambda c: (1 if c.get(\"gate_pass\") else 0, score10(c)),\n   \
          \ reverse=True\n  )\n\n  shortlist_count = 0\n  borderline_count = 0\n \
