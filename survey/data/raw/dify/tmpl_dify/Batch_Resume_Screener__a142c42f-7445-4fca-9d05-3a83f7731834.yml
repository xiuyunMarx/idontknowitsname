          t]+\", \" \", text)\n  text = re.sub(r\"\\n{3,}\", \"\\n\\n\", text).strip()\n\
          \  MAX_CHARS = 18000\n  if len(text) > MAX_CHARS:\n    text = text[:MAX_CHARS]\
          \ + \"\\n\\n[TRUNCATED]\"\n  return {\"resume_text_clean\": text}\n"
