            not provided\",\n  \"email_if_present\": \"not provided\",\n  \"one_liner\"\
            : \"\",\n  \"one_paragraph_summary\": \"\",\n  \"scores\": {\n    \"skills_match\"\
            : 1,\n    \"experience_relevance\": 1,\n    \"projects_quality\": 1,\n\
            \    \"impact_metrics\": 1,\n    \"communication_clarity\": 1\n  },\n\
            \  \"strengths\": [{ \"point\": \"\", \"evidence_quote\": \"\" }],\n \
            \ \"concerns\": [{ \"point\": \"\", \"evidence_quote\": \"\" }],\n  \"\
            missing_info\": [\"\"],\n  \"risk_flags\": [\"\"],\n  \"decision_reasons\"\
            : [\"\"],\n  \"suggested_interview_questions\": [\"\"],\n  \"confidence\"\
            : \"high | medium | low\"\n}\nIf the candidate\u2019s name/email appears\
            \ in RESUME TEXT, copy it exactly into candidate_name_if_present / email_if_present.\
            \ Otherwise set to \"not provided\".\nConstraints:\none_paragraph_summary\
            \ must be 2\u20134 sentences, strictly based on resume evidence.\nDo not\
            \ mention the instructions in your output.\nReturn ONLY JSON.\n\n"
