    - data:
        code: "import json, re\n\ndef clamp(x, lo=1, hi=10):\n  try:\n    x = float(x)\n\
          \  except:\n    x = 0.0\n  return max(lo, min(hi, x))\n\ndef parse_terms(s):\n\
          \  if not s:\n    return []\n  parts = re.split(r\"[,\\n;]+\", str(s).lower())\n\
          \  return [p.strip() for p in parts if p.strip()]\n\ndef safe_json_loads(txt):\n\
          \  try:\n    return json.loads(txt)\n  except:\n    return None\n\ndef main(**kwargs):\n\
          \  # ---- Map inputs safely (handles Dify keyword mismatch) ----\n  profile_text\
          \ = kwargs.get(\"profile_text\") or kwargs.get(\"profile\") or \"\"\n  resume_text_clean\
          \ = kwargs.get(\"resume_text_clean\") or kwargs.get(\"resume_clean\") or\
          \ kwargs.get(\"resume_text\") or \"\"\n  must_have_skills = kwargs.get(\"\
          must_have_skills\") or kwargs.get(\"must_haves\") or \"\"\n  eval_json =\
          \ kwargs.get(\"eval_json\") or kwargs.get(\"evaluation_json\") or kwargs.get(\"\
          evaluation\") or kwargs.get(\"llm_eval\") or \"\"\n  weights_json = kwargs.get(\"\
          weights_json\") or kwargs.get(\"weights\") or \"\"\n\n  # -----------------------------\n\
          \  # 1) Parse profile JSON\n  # -----------------------------\n  p = safe_json_loads(profile_text)\
          \ or {}\n\n  # -----------------------------\n  # 2) Strict must-have gate\n\
          \  # -----------------------------\n  must_terms = parse_terms(must_have_skills)\n\
          \n  skills_text = \" \".join([str(x).lower() for x in (p.get(\"skills\"\
          ) or [])])\n  proj_stack = \" \".join(\n    [\" \".join([str(s) for s in\
          \ (pr.get(\"stack\") or [])]) for pr in (p.get(\"projects\") or [])]\n \
          \ ).lower()\n\n  full_text = (str(resume_text_clean or \"\") + \" \" + skills_text\
          \ + \" \" + proj_stack).lower()\n  missing = [t for t in must_terms if t\
          \ not in full_text]\n  gate_pass = (len(missing) == 0)\n\n  # -----------------------------\n\
          \  # 3) Parse eval JSON (LLM output)\n  # -----------------------------\n\
          \  e = safe_json_loads(eval_json)\n  if not isinstance(e, dict):\n    e\
          \ = {\n      \"scores\": {\n        \"skills_match\": 1,\n        \"experience_relevance\"\
          : 1,\n        \"projects_quality\": 1,\n        \"impact_metrics\": 1,\n\
          \        \"communication_clarity\": 1\n      },\n      \"strengths\": [],\n\
          \      \"concerns\": [{\"point\":\"Invalid JSON output from model\",\"evidence_quote\"\
          :\"not provided\"}],\n      \"risk_flags\": [\"invalid_json\"],\n      \"\
          missing_info\": [],\n      \"suggested_interview_questions\": [],\n    \
          \  \"one_paragraph_summary\": \"Could not parse model output.\"\n    }\n\
          \n  # -----------------------------\n  # 4) If gate fails: return readable\
          \ reject record\n  # -----------------------------\n  if not gate_pass:\n\
          \    gate_reason = f\"Missing must-have skills: {', '.join(missing[:10])}\"\
          \ if missing else \"Missing must-have skills.\"\n    candidate_record =\
          \ {\n      \"name\": p.get(\"name\") or \"not provided\",\n      \"email\"\
          : p.get(\"email\") or \"not provided\",\n      \"gate_pass\": False,\n \
          \     \"gate_reasons\": [gate_reason],\n\n      \"final_score_10\": 1,\n\
          \      \"recommendation\": \"reject\",\n      \"confidence\": \"high\",\n\
          \n      \"scores_0_10\": {\n        \"skills_match\": 1,\n        \"experience_relevance\"\
          : 1,\n        \"projects_quality\": 1,\n        \"impact_metrics\": 1,\n\
          \        \"communication_clarity\": 1\n      },\n\n      \"recruiter_card\"\
          : {\n        \"one_liner\": \"Rejected by strict must-have requirements.\"\
          ,\n        \"top_strengths\": [],\n        \"top_concerns\": [{\"point\"\
          : gate_reason, \"evidence_quote\": \"not provided\"}],\n        \"decision_reasons\"\
          : [\"Failed must-have gate\"]\n      },\n\n      \"summary\": \"Rejected\
          \ by strict must-have requirements.\",\n      \"strengths\": [],\n     \
          \ \"concerns\": [{\"point\": gate_reason, \"evidence_quote\": \"not provided\"\
          }],\n      \"risk_flags\": [\"missing_must_have\"],\n      \"missing_info\"\
          : [],\n      \"interview_questions\": []\n    }\n    return {\"candidate_record\"\
          : candidate_record}\n\n  # -----------------------------\n  # 5) If gate\
          \ passes: compute weighted score\n  # -----------------------------\n  w\
          \ = {\"skills\":0.25,\"experience\":0.25,\"projects\":0.20,\"impact\":0.20,\"\
          communication\":0.10}\n  if weights_json and str(weights_json).strip():\n\
          \    w_in = safe_json_loads(weights_json)\n    if isinstance(w_in, dict):\n\
          \      for k in w:\n        try:\n          if k in w_in:\n            w[k]\
          \ = float(w_in[k])\n        except:\n          pass\n\n  s = e.get(\"scores\"\
          , {}) if isinstance(e.get(\"scores\", {}), dict) else {}\n  skills = clamp(s.get(\"\
          skills_match\"))\n  exp    = clamp(s.get(\"experience_relevance\"))\n  proj\
          \   = clamp(s.get(\"projects_quality\"))\n  impact = clamp(s.get(\"impact_metrics\"\
          ))\n  comm   = clamp(s.get(\"communication_clarity\"))\n\n  weighted_10\
          \ = (w[\"skills\"]*skills + w[\"experience\"]*exp + w[\"projects\"]*proj\
          \ + w[\"impact\"]*impact + w[\"communication\"]*comm)\n\n  final_score_10\
          \  = round(weighted_10, 1)\n  final_score_100 = round((weighted_10 / 10.0)\
          \ * 100)\n\n  if final_score_10 >= 7.5:\n    rec = \"advance\"\n  elif final_score_10\
          \ >= 5:\n    rec = \"maybe\"\n  else:\n    rec = \"reject\"\n\n  confidence\
          \ = (e.get(\"confidence\") or \"\").strip().lower()\n  if confidence not\
          \ in [\"high\", \"medium\", \"low\"]:\n    confidence = \"medium\"\n\n \
          \ strengths = e.get(\"strengths\") or []\n  concerns  = e.get(\"concerns\"\
          ) or []\n  if not isinstance(strengths, list): strengths = []\n  if not\
          \ isinstance(concerns, list): concerns = []\n\n  top_strengths = strengths[:3]\n\
          \  top_concerns  = concerns[:3]\n\n  one_liner = (e.get(\"one_liner\") or\
          \ \"\").strip()\n  if not one_liner:\n    one_liner = (e.get(\"one_paragraph_summary\"\
          ) or \"\").strip()\n  if not one_liner:\n    one_liner = \"not provided\"\
          \n\n  summary = (e.get(\"one_paragraph_summary\") or \"\").strip() or \"\
          not provided\"\n\n  iq = e.get(\"suggested_interview_questions\") or []\n\
          \  if not isinstance(iq, list):\n    iq = []\n  iq = iq[:6]\n\n  mi = e.get(\"\
          missing_info\") or []\n  if not isinstance(mi, list):\n    mi = []\n  mi\
          \ = mi[:10]\n\n  rf = e.get(\"risk_flags\") or []\n  if not isinstance(rf,\
          \ list):\n    rf = []\n\n  decision_reasons = e.get(\"decision_reasons\"\
          ) or []\n  if not isinstance(decision_reasons, list):\n    decision_reasons\
          \ = []\n  decision_reasons = decision_reasons[:2]\n\n  candidate_record\
          \ = {\n    \"name\": p.get(\"name\") or e.get(\"candidate_name_if_present\"\
          ) or \"not provided\",\n    \"email\": p.get(\"email\") or e.get(\"email_if_present\"\
          ) or \"not provided\",\n\n    \"gate_pass\": True,\n    \"gate_reasons\"\
          : [],\n\n    \"final_score_10\": final_score_10,\n    \"final_score_100\"\
          : final_score_100,\n    \"recommendation\": rec,\n    \"confidence\": confidence,\n\
          \n    \"scores_0_10\": {\n      \"skills_match\": skills,\n      \"experience_relevance\"\
          : exp,\n      \"projects_quality\": proj,\n      \"impact_metrics\": impact,\n\
          \      \"communication_clarity\": comm\n    },\n\n    \"recruiter_card\"\
          : {\n      \"one_liner\": one_liner,\n      \"top_strengths\": top_strengths,\n\
          \      \"top_concerns\": top_concerns,\n      \"decision_reasons\": decision_reasons\n\
          \    },\n\n    \"summary\": summary,\n    \"strengths\": strengths[:6],\n\
          \    \"concerns\": concerns[:6],\n    \"risk_flags\": rf,\n    \"missing_info\"\
          : mi,\n    \"interview_questions\": iq\n  }\n\n  return {\"candidate_record\"\
          : candidate_record}\n"
        code_language: python3
